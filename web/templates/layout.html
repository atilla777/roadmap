{{define "layout"}}<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{.Title}} — roadmap</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/htmx.min.js"></script>
    <script src="/static/sortable.min.js"></script>
</head>
<body>
<div class="container">
    <header>
        <h1><a href="/">roadmap</a></h1>
        {{if .ProjectName}}<nav><a href="/projects/{{.ProjectID}}">{{.ProjectName}}</a></nav>{{end}}
    </header>
    <main>
        {{.Content}}
    </main>
</div>
<script>
document.body.addEventListener('htmx:afterSettle', function() {
    initSortables();
});
function initSortables() {
    document.querySelectorAll('.task-list:not(.sortable-initialized)').forEach(function(el) {
        el.classList.add('sortable-initialized');
        new Sortable(el, {
            group: 'tasks',
            animation: 150,
            handle: '.drag-handle',
            ghostClass: 'sortable-ghost',
            onEnd: function(evt) {
                var taskId = evt.item.dataset.taskId;
                var newIndex = evt.newIndex;
                htmx.ajax('PUT', '/tasks/' + taskId + '/order', {
                    headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                    values: {position: newIndex}
                });
            }
        });
    });
    document.querySelectorAll('.phase-container:not(.sortable-initialized)').forEach(function(el) {
        el.classList.add('sortable-initialized');
        new Sortable(el, {
            animation: 150,
            handle: '.phase-drag-handle',
            ghostClass: 'sortable-ghost',
            draggable: '.phase',
            onEnd: function(evt) {
                var phaseId = evt.item.dataset.phaseId;
                var newIndex = evt.newIndex;
                htmx.ajax('PUT', '/phases/' + phaseId + '/order', {
                    headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                    values: {position: newIndex}
                });
            }
        });
    });
}
document.addEventListener('DOMContentLoaded', initSortables);

function togglePhaseDesc(btn) {
    var phase = btn.closest('.phase');
    var phaseId = phase.dataset.phaseId;
    var existing = phase.querySelector('.phase-desc-edit');
    if (existing) {
        existing.remove();
        return;
    }
    var descEl = phase.querySelector('.phase-desc');
    var current = descEl ? descEl.textContent : '';
    var textarea = document.createElement('textarea');
    textarea.className = 'phase-desc-edit';
    textarea.value = current;
    textarea.placeholder = 'Phase description...';
    textarea.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') { textarea.remove(); return; }
        if (e.key === 'Enter' && e.ctrlKey) {
            htmx.ajax('PUT', '/phases/' + phaseId, {
                target: phase, swap: 'outerHTML',
                headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                values: {description: textarea.value}
            });
        }
    });
    textarea.addEventListener('blur', function() {
        var orig = descEl ? descEl.textContent : '';
        if (textarea.value !== orig) {
            htmx.ajax('PUT', '/phases/' + phaseId, {
                target: phase, swap: 'outerHTML',
                headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                values: {description: textarea.value}
            });
        } else {
            textarea.remove();
        }
    });
    var header = phase.querySelector('.phase-header');
    header.insertAdjacentElement('afterend', textarea);
    textarea.focus();
}

function toggleDesc(btn) {
    var task = btn.closest('.task');
    var taskId = task.dataset.taskId;
    var existing = task.querySelector('.task-desc-edit');
    if (existing) {
        existing.remove();
        return;
    }
    var body = task.querySelector('.task-body');
    var descEl = body.querySelector('.task-desc');
    var current = descEl ? descEl.textContent : '';
    var textarea = document.createElement('textarea');
    textarea.className = 'task-desc-edit';
    textarea.value = current;
    textarea.placeholder = 'Description (markdown)...';
    textarea.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') { textarea.remove(); return; }
        if (e.key === 'Enter' && e.ctrlKey) {
            htmx.ajax('PUT', '/tasks/' + taskId, {
                target: task, swap: 'outerHTML',
                headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                values: {description: textarea.value}
            });
        }
    });
    textarea.addEventListener('blur', function() {
        var orig = descEl ? descEl.textContent : '';
        if (textarea.value !== orig) {
            htmx.ajax('PUT', '/tasks/' + taskId, {
                target: task, swap: 'outerHTML',
                headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                values: {description: textarea.value}
            });
        } else {
            textarea.remove();
        }
    });
    body.appendChild(textarea);
    textarea.focus();
}

function filterTasks() {
    var search = (document.getElementById('filter-search') || {}).value || '';
    var status = (document.getElementById('filter-status') || {}).value || '';
    search = search.toLowerCase();
    document.querySelectorAll('.task').forEach(function(el) {
        var show = true;
        if (status && el.dataset.status !== status) show = false;
        if (search) {
            var text = (el.querySelector('.task-title') || {}).textContent || '';
            var desc = (el.querySelector('.task-desc') || {}).textContent || '';
            if (text.toLowerCase().indexOf(search) === -1 && desc.toLowerCase().indexOf(search) === -1) show = false;
        }
        el.style.display = show ? '' : 'none';
    });
}

function markOverdueDates() {
    var today = new Date().toISOString().slice(0, 10);
    document.querySelectorAll('.due-date').forEach(function(el) {
        var due = el.dataset.due;
        if (due && due < today) {
            el.classList.add('overdue');
        } else {
            el.classList.remove('overdue');
        }
    });
}

document.addEventListener('DOMContentLoaded', markOverdueDates);
document.body.addEventListener('htmx:afterSettle', markOverdueDates);
</script>
</body>
</html>{{end}}
